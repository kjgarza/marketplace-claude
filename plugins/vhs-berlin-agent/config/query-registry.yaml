# Common search categories
categories:
  german:
    keywords: ["Deutsch", "German", "DaF", "Deutsch als Fremdsprache"]
    special_rules: "Some courses require consultation and placement test"
  
  integration:
    keywords: ["Integrationskurs", "Integration course"]
    special_rules: "Registration only after mandatory consultation"
  
  languages:
    keywords: ["Sprachen", "Languages", "Englisch", "Spanisch", "Französisch"]
  
  art:
    keywords: ["Kunst", "Art", "Malen", "Zeichnen"]
  
  pottery:
