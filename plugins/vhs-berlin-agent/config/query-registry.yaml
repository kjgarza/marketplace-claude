# VHS Berlin Query Registry
# URL patterns and parameters for VHS Berlin search

base_url: https://vhsit.berlin.de

patterns:
  direct_course:
    template: "{{base_url}}/VHSKURSE/BusinessPages/CourseDetail.aspx?id={{course_id}}"
    confidence: verified
    tested_at: "2026-04-18"
    note: "Direct course ID links appear in public Berlin pages"
  
  district_location:
    template: "{{base_url}}/VHSKURSE/BusinessPages/CourseList.aspx?direkt=1&bezirk={{district_code}}&lehrstaette={{location_code}}"
    confidence: likely
    tested_at: "2026-04-18"
    note: "District and location parameters found in public pages"
  
  keyword_search:
    template: "{{base_url}}/VHSKURSE/BusinessPages/CourseList.aspx?stichw={{keyword}}"
    confidence: observed
    tested_at: null
    note: "Seen in social/search snippets, not yet fully validated"
  
  date_range:
    template: "{{base_url}}/VHSKURSE/BusinessPages/CourseList.aspx?begonnen={{start_date}}&beendet={{end_date}}"
    confidence: observed
    tested_at: null
    note: "Date parameters observed but not validated"

