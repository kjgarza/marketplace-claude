[profile]
name              = "Kristian"
move_in_earliest  = "2026-06-01"
move_in_latest    = "2026-09-01"
contract_type     = ["unbefristet"]
furnished         = "either"
schufa_ready      = true
wbs               = false
employer          = "Digital Science"

[search]
districts         = ["Schöneberg"]
min_rooms         = 2
max_rooms         = 4
min_sqm           = 100
max_warm_rent_eur = 2200
max_cold_rent_eur = 2000
keywords_required = ["Altbau"]
deal_breakers     = ["WG", "Tausch", "Souterrain"]

[portals]
enabled = ["kleinanzeigen", "immoscout24"]

[scraping]
cache_ttl_listing_s = 3600
max_concurrent      = 2

[scam_detection]
threshold_block  = 0.85
threshold_review = 0.55

[contact]
default_language = "de"
tone             = "warm-professional"
auto_send        = false

[notifications]
desktop = true

