name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate before release
        run: python3 scripts/validate.py

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        run: |
          VERSION=${{ steps.version.outputs.version }}
          tar -czf "marketplace-claude-v${VERSION}.tar.gz" \
            .claude-plugin/marketplace.json \
            plugins/ \
            README.md \
            LICENSE.md
          echo "artifact=marketplace-claude-v${VERSION}.tar.gz" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          body: |
            ## marketplace-claude v${{ steps.version.outputs.version }}

            Install via Claude Code:
            ```
            /plugin marketplace add kjgarza/marketplace-claude
            ```

            See [CLAUDE.md](CLAUDE.md) for plugin list and details.
          files: ${{ env.artifact }}
          generate_release_notes: true
